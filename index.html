<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedLabz Access</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #151c33;
      border: 1px solid #2a355a;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 32px;
    }
    p {
      color: #c9d2ee;
      line-height: 1.5;
    }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #3a4878;
      background: #0f1529;
      color: white;
      font-size: 16px;
      margin-top: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #4f8cff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #3c78e8;
    }
    .error {
      color: #ff8f8f;
      margin-top: 12px;
      display: none;
    }
    #labFrame {
      display: none;
      width: 100%;
      height: 100vh;
      border: none;
    }
    #gateScreen {
      display: block;
    }
  </style>
</head>
<body>
  <div id="gateScreen" class="wrap">
    <div class="card">
      <h1>MedLabz</h1>
      <p>Protected demonstration access.</p>
      <p>Enter the access code to launch the lab.</p>
      <input type="password" id="pw" placeholder="Enter access code" />
      <button onclick="checkPassword()">Enter Lab</button>
      <div id="err" class="error">Incorrect password.</div>
    </div>
  </div>

  <iframe id="labFrame" src=""></iframe>

  <script>
    const PASSWORD = "alfie2026";

    function checkPassword() {
      const entered = document.getElementById("pw").value;
      const err = document.getElementById("err");
      if (entered === PASSWORD) {
        document.getElementById("gateScreen").style.display = "none";
        const frame = document.getElementById("labFrame");
        frame.src = "lab.html";
        frame.style.display = "block";
      } else {
        err.style.display = "block";
      }
    }
  </script>
</body>
</html>
